###############################################################################
# Workflow: Infrastructure Diagram Generation
#
# On manual trigger (or push to infra/ when uncommented):
#   1. Parses Terraform & CloudFormation to extract resources and relationships
#   2. Calls Amazon Bedrock (Claude) to generate an AI-enriched summary
#   3. Produces Mermaid architecture diagrams
#   4. Commits updated diagrams back to the repo
###############################################################################

name: Generate Infrastructure Diagrams

on:
  # Uncomment push trigger for production use:
  # push:
  #   branches: [main]
  #   paths:
  #     - "infra/**"
  workflow_dispatch:
    inputs:
      use_simulated:
        description: "Use simulated Bedrock response (skip real API call)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  AWS_REGION: us-east-1

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          sudo apt-get install -y graphviz
          pip install -r requirements.txt

      - name: Configure AWS credentials
        if: ${{ github.event.inputs.use_simulated != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- Parse IaC files ----
      - name: Parse Terraform resources
        run: node scripts/parse-terraform.js infra/terraform > /tmp/tf-resources.json

      - name: Parse CloudFormation resources
        run: node scripts/parse-cloudformation.js infra/cloudformation > /tmp/cfn-resources.json

      # ---- Detect changes ----
      - name: Detect infrastructure changes
        id: diff
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff HEAD~1 -- infra/ > /tmp/infra-diff.txt || true
          else
            echo "Initial commit, no diff available" > /tmp/infra-diff.txt
          fi

      # ---- AI analysis via Bedrock ----
      - name: AI-enriched analysis via Amazon Bedrock
        run: |
          node scripts/bedrock-analyze.js \
            --tf-resources /tmp/tf-resources.json \
            --cfn-resources /tmp/cfn-resources.json \
            --diff /tmp/infra-diff.txt \
            --output /tmp/ai-analysis.json
        env:
          USE_SIMULATED: ${{ github.event.inputs.use_simulated }}

      # ---- Generate diagrams ----
      - name: Generate Mermaid architecture diagrams
        run: |
          node scripts/generate-infra-diagrams.js \
            --tf-resources /tmp/tf-resources.json \
            --cfn-resources /tmp/cfn-resources.json \
            --ai-analysis /tmp/ai-analysis.json \
            --output docs/

      - name: Generate AWS icon diagrams
        run: python scripts/generate-aws-diagram.py --output docs

      # ---- Commit results ----
      - name: Commit updated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "docs: auto-generate infrastructure diagrams

          AI analysis powered by Amazon Bedrock (Claude).
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push || echo "Nothing to push"
